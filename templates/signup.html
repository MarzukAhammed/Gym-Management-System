{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .signup-card {
      width: 420px;
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(0,0,0,.4);
      color: #fff;
    }

    .signup-card h2 {
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }

    .signup-card p {
      text-align: center;
      color: #ddd;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .signup-card label {
      font-size: 14px;
      margin-top: 12px;
      color: #eee;
    }

    .signup-card input {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
    }

    .signup-card input:focus {
      outline: none;
      box-shadow: 0 0 0 2px #00e0ff;
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .signup-card button {
      background: linear-gradient(135deg, #00e0ff, #007bff);
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px;
      transition: 0.3s;
    }

    .signup-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0,224,255,.4);
    }

    .signup-card a {
      color: #00e0ff;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-card a:hover {
      text-decoration: underline;
    }

    .home-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #007bff;
      padding: 12px 18px;
      border-radius: 50px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,.4);
    }
  </style>
</head>

<body>

  <div class="signup-card">
    <h2>Join Our Gym</h2>
    <p>Create your account & start your fitness journey</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="w-100">
        <i class="fa-solid fa-user-plus me-2"></i> Create Account
      </button>
    </form>

    <p class="mt-4 text-center">
      Already have an account?
      <a href="{% url 'login' %}">Login here</a>
    </p>
  </div>

  <a href="{% url 'home' %}" class="home-btn">
    🏠 Home
  </a>
{% include "chatbox_partial.html" %}
</body>
</html>
