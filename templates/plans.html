
{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Plans</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
  <div class="container mt-5">
    <h2>Our Plans</h2>
    <div class="row">
      {% for plan in plans %}
        <div class="col-md-4 mb-3">
          <div class="card p-3 shadow">
            {% if plan.image %}
              <img src="{{ plan.image.url }}" class="card-img-top" alt="{{ plan.title }}">
            {% endif %}
            <div class="card-body">
              <h4>{{ plan.title }}</h4>
              <p>{{ plan.description }}</p>
              <strong>৳{{ plan.price }}</strong> / {{ plan.duration }}
            </div>
          </div>
        </div>
      {% empty %}
        <p>No plans available right now.</p>
      {% endfor %}
    </div>
  </div>
  <a href="{% url 'home' %}" 
   style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     background:#007bff;
     padding:12px 18px;
     border-radius: 50px;
     color:white;
     font-weight:bold;
     text-decoration:none;
     font-size:16px;
     z-index: 9999;
     box-shadow:0 4px 8px rgba(0,0,0,0.3);
   ">
   🏠 Home
</a>
</body>
</html>
