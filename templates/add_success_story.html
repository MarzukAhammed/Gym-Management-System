{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Success Story</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <style>
    body {
      background: linear-gradient(135deg, #0b1220, #171f34);
      min-height: 100vh;
      color: #fff;
    }
    .story-wrap {
      max-width: 760px;
      margin: 110px auto 40px;
      padding: 0 16px;
    }
    .story-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 14px 35px rgba(0,0,0,0.35);
    }
    .form-label { font-weight: 600; color: #d7e6ff; }
    .form-control {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.13);
      color: #fff;
      border-color: #5aa0ff;
      box-shadow: 0 0 0 0.2rem rgba(90, 160, 255, 0.18);
    }
  </style>
</head>
<body>
{% include "navbar.html" %}
<div class="story-wrap">
  <div class="story-card">
    <h3 class="mb-3" data-i18n="Share Your Success Story">Share Your Success Story</h3>
    <p class="text-light mb-4" data-i18n="Your story may appear in the home page success slider and motivate others.">Your story may appear in the home page success slider and motivate others.</p>
    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label" data-i18n="Title">Title</label>
        {{ form.title }}
      </div>
      <div class="mb-3">
        <label class="form-label" data-i18n="Your Story">Your Story</label>
        {{ form.story }}
      </div>
      <div class="mb-4">
        <label class="form-label" data-i18n="Photo (optional)">Photo (optional)</label>
        {{ form.photo }}
      </div>
      <button type="submit" class="btn btn-primary px-4" data-i18n="Publish Story">Publish Story</button>
    </form>
  </div>
</div>
{% include "chatbox_partial.html" %}
</body>
</html>
