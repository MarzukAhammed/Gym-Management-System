
{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Our Team</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
  <div class="container mt-5">
    <h2>Meet Our Trainers</h2>
    <div class="row">
      {% for trainer in trainers %}
        <div class="col-md-3 mb-3">
          <div class="card p-3 shadow text-center">
            {% if trainer.photo %}
              <img src="{{ trainer.photo.url }}" class="rounded-circle mb-2" width="100" height="100" alt="{{ trainer.name }}">
            {% endif %}
            <h5>{{ trainer.name }}</h5>
            <p>{{ trainer.specialty }}</p>
          </div>
        </div>
      {% endfor %}
    </div>
  </div>
  <a href="{% url 'home' %}" 
   style="
     position: fixed;
     bottom: 20px;
     right: 20px;
     background:#007bff;
     padding:12px 18px;
     border-radius: 50px;
     color:white;
     font-weight:bold;
     text-decoration:none;
     font-size:16px;
     z-index: 9999;
     box-shadow:0 4px 8px rgba(0,0,0,0.3);
   ">
   🏠 Home
</a>
{% include "chatbox_partial.html" %}
</body>
</html>
