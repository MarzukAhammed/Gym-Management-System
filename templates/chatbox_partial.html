{% load static %}
{% csrf_token %}
<style>
#floating-cat-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    cursor: grab;
    transition: all 0.8s ease-in-out;
    z-index: 10001 !important;
}

#floating-cat-container:active { cursor: grabbing; }

#cat-trigger img {
    width: 70px;
    height: auto;
    display: block;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
}

#premium-chatbox {
    position: fixed;
    bottom: 110px;
    right: 30px;
    width: 360px;
    height: 500px;
    background: linear-gradient(165deg, rgba(16, 26, 44, 0.92), rgba(9, 14, 26, 0.95));
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    display: none;
    flex-direction: column;
    box-shadow: 0 20px 55px rgba(0,0,0,0.55);
    overflow: hidden;
    color: white;
    z-index: 10000 !important;
}

.chat-header {
    background: linear-gradient(90deg, rgba(53, 88, 220, 0.35), rgba(86, 193, 253, 0.18));
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}

.user-info { display:flex; align-items:center; gap:10px; }
.ai-meta { display:flex; flex-direction:column; line-height:1.15; }
.ai-name { font-weight:700; letter-spacing:0.2px; color:#fff; }
.ai-tagline { color: rgba(255,255,255,0.78); font-size:11px; }

.status-dot {
    width: 10px;
    height: 10px;
    background: #2ecc71;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 10px #2ecc71;
}

#chat-messages {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    background:
        radial-gradient(circle at top right, rgba(86, 193, 253, 0.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(92, 110, 240, 0.16), transparent 35%);
}

.bot-msg {
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
    border-radius: 16px 16px 16px 6px;
    max-width: 80%;
    color: #fff;
    font-size: 14px;
}

.user-msg {
    background: linear-gradient(120deg, #316dff, #57b4ff) !important;
    color: #fff !important;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 8px 20px rgba(42, 115, 255, 0.35);
}

.chat-input-area {
    padding: 12px;
    display: flex;
    gap: 10px;
    background: rgba(0, 0, 0, 0.18);
    border-top: 1px solid rgba(255,255,255,0.1);
}

.chat-input-area input {
    flex: 1;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 10px 14px;
    color: white;
    outline: none;
}

.chat-input-area input::placeholder { color: rgba(255,255,255,0.6); }

.chat-input-area button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(130deg, #335bff, #4cc2ff);
    box-shadow: 0 10px 22px rgba(39, 118, 255, 0.35);
}

.close-btn {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 8px;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    background: rgba(255,255,255,0.12);
}
</style>
<div id="floating-cat-container">
    <div id="cat-trigger">
        <img
            src="{% static 'images/Lovely Cat.gif' %}"
            data-idle-src="{% static 'images/Lovely Cat.gif' %}"
            data-run-src="{% static 'images/cat_run.gif' %}"
            id="main-cat-img"
            alt="Lolona"
        >
    </div>
</div>

<script>
const isLoggedIn = "{{ user.is_authenticated|yesno:'true,false' }}";
</script>

<div id="premium-chatbox" class="glass-effect">
    <div class="chat-header">
        <div class="user-info">
            <div class="status-dot"></div>
            <div class="ai-meta">
                <span class="ai-name">Lolona AI</span>
                <small class="ai-tagline">Premium fitness assistant</small>
            </div>
        </div>
        <button onclick="toggleChat()" class="close-btn">&times;</button>
    </div>
    <div id="chat-messages">
        <div class="bot-msg">
          {% if user.is_authenticated %}
            Welcome back, {{ user.username }}. Ask your fitness question.
          {% else %}
            Welcome back, human. Ask your fitness question.
          {% endif %}
        </div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="ai-user-input" placeholder="Type a message...">
        <button onclick="sendToAI()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
(function () {
    // Homepage already loads full chatbot logic from static/js/script.js.
    // Avoid double-binding handlers there.
    if (typeof window.sendToAI === "function" && typeof window.toggleChat === "function") {
        return;
    }

    const cat = document.getElementById("floating-cat-container");
    const catImg = document.getElementById("main-cat-img");
    const chatBox = document.getElementById("premium-chatbox");
    const input = document.getElementById("ai-user-input");
    const messages = document.getElementById("chat-messages");
    const csrfInput = document.querySelector("[name=csrfmiddlewaretoken]");

    if (!cat || !chatBox || !input || !messages) return;

    function appendMessage(type, text) {
        const align = type === "user" ? "flex-end" : "flex-start";
        const bubbleClass = type === "user" ? "user-msg" : "bot-msg";
        messages.innerHTML += `<div class="message-wrapper ${type}" style="justify-content: ${align}; display: flex; margin-bottom: 10px;"><div class="${bubbleClass}" style="padding: 8px 15px; border-radius: 15px;">${text}</div></div>`;
        messages.scrollTop = messages.scrollHeight;
    }

    window.toggleChat = window.toggleChat || function () {
        chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";
    };

    function runCatToLolonaTextFallback() {
        const aiText = chatBox.querySelector('.ai-name') || chatBox.querySelector('.chat-header .user-info span');
        if (!aiText) return;

        if (catImg && catImg.dataset.runSrc) {
            catImg.src = catImg.dataset.runSrc;
        }

        requestAnimationFrame(function () {
            const catRect = cat.getBoundingClientRect();
            const textRect = aiText.getBoundingClientRect();
            let newLeft = textRect.left + (textRect.width / 2) - (catRect.width / 2);
            let newTop = textRect.top - (catRect.height * 0.85);
            const maxLeft = window.innerWidth - catRect.width - 10;
            const maxTop = window.innerHeight - catRect.height - 10;
            newLeft = Math.max(10, Math.min(newLeft, maxLeft));
            newTop = Math.max(10, Math.min(newTop, maxTop));
            cat.style.transition = "all 0.7s ease-in-out";
            cat.style.left = newLeft + "px";
            cat.style.top = newTop + "px";
            cat.style.right = "auto";
            cat.style.bottom = "auto";
        });

        setTimeout(function () {
            if (catImg && catImg.dataset.idleSrc) catImg.src = catImg.dataset.idleSrc;
        }, 900);
    }

    let isDragging = false;
    let isMoving = false;
    let startX = 0, startY = 0;
    let offsetX = 0, offsetY = 0;
    let pressTimer = null;
    const LONG_PRESS_MS = 320;

    function onMouseMove(e) {
        const moveX = Math.abs(e.clientX - startX);
        const moveY = Math.abs(e.clientY - startY);
        if (moveX > 5 || moveY > 5) {
            isDragging = true;
            isMoving = true;
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            cat.style.transition = "none";
            cat.style.left = (e.clientX - offsetX) + "px";
            cat.style.top = (e.clientY - offsetY) + "px";
            cat.style.right = "auto";
            cat.style.bottom = "auto";
        }
    }

    function onMouseUp() {
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onMouseUp);
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
        cat.style.transition = "all 0.3s ease";
        setTimeout(function () {
            isDragging = false;
            isMoving = false;
        }, 100);
    }

    cat.addEventListener("mousedown", function (e) {
        if (e.button !== 0) return;
        isDragging = false;
        isMoving = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = cat.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
        // Long-press opens chat reliably (even if click sometimes misses).
        pressTimer = setTimeout(function () {
            if (!isMoving && !isDragging) {
                chatBox.style.display = "flex";
            }
        }, LONG_PRESS_MS);
        e.preventDefault();
    });

    cat.addEventListener("click", function () {
        if (isMoving || isDragging) return;

        if (typeof isLoggedIn !== "undefined" && isLoggedIn === "false") {
            const maxX = window.innerWidth - 180;
            const maxY = window.innerHeight - 180;
            // Slow down the "run away" a bit so it's easier to follow.
            cat.style.transition = "all 1.9s ease-in-out";
            cat.style.left = (Math.random() * maxX) + "px";
            cat.style.top = (Math.random() * maxY) + "px";
            cat.style.right = "auto";
            cat.style.bottom = "auto";
            if (catImg && catImg.dataset.runSrc) {
                catImg.src = catImg.dataset.runSrc;
                setTimeout(function () { catImg.src = catImg.dataset.idleSrc || catImg.src; }, 2100);
            }
            return;
        }

        const willOpen = chatBox.style.display !== "flex";
        window.toggleChat();
        if (willOpen) {
            setTimeout(runCatToLolonaTextFallback, 40);
        }
    });

    window.sendToAI = window.sendToAI || async function () {
        const text = input.value.trim();
        if (!text) return;
        appendMessage("user", text);
        input.value = "";

        try {
            const response = await fetch("/chat-with-ai/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": csrfInput ? csrfInput.value : ""
                },
                body: `text=${encodeURIComponent(text)}`
            });
            const data = await response.json();
            appendMessage("bot", data.reply || "Meow.");
        } catch (e) {
            appendMessage("bot", "Network issue. Try again.");
        }
    };

    input.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            window.sendToAI();
        }
    });
})();
</script>
