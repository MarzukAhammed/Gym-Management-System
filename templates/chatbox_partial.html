{% load static %}
{% csrf_token %}
<style>
#floating-cat-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    cursor: grab;
    transition: all 0.8s ease-in-out;
    z-index: 10001 !important;
    touch-action: none; /* allow pointer dragging without browser gestures */
}

#floating-cat-container:active { cursor: grabbing; }

#cat-trigger img {
    width: 70px;
    height: auto;
    display: block;
    filter: drop-shadow(0 5px 15px rgba(0,0,0,0.3));
}

#premium-chatbox {
    position: fixed;
    bottom: 110px;
    right: 30px;
    width: 360px;
    height: 500px;
    background: linear-gradient(165deg, rgba(16, 26, 44, 0.92), rgba(9, 14, 26, 0.95));
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px;
    display: none;
    flex-direction: column;
    box-shadow: 0 20px 55px rgba(0,0,0,0.55);
    overflow: hidden;
    color: white;
    z-index: 10000 !important;
}

.chat-header {
    background: linear-gradient(90deg, rgba(53, 88, 220, 0.35), rgba(86, 193, 253, 0.18));
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
}

.user-info { display:flex; align-items:center; gap:10px; }
.ai-meta { display:flex; flex-direction:column; line-height:1.15; }
.ai-name { font-weight:700; font-size: 15px; letter-spacing:0.2px; color:#fff; }
.ai-tagline { color: rgba(255,255,255,0.7); font-size:12px; }

.status-dot {
    width: 10px;
    height: 10px;
    background: #2ecc71;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 10px #2ecc71;
}

#chat-messages {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    background:
        radial-gradient(circle at top right, rgba(86, 193, 253, 0.18), transparent 35%),
        radial-gradient(circle at bottom left, rgba(92, 110, 240, 0.16), transparent 35%);
}

.bot-msg {
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 10px 14px;
    border-radius: 16px 16px 16px 6px;
    max-width: 80%;
    color: #fff;
    font-size: 14px;
}

.typing-bubble {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    display: inline-block;
    animation: typingBounce 1s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: 0.15s; opacity: 0.9; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; opacity: 0.8; }
@keyframes typingBounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-4px); }
}

.user-msg {
    background: linear-gradient(120deg, #316dff, #57b4ff) !important;
    color: #fff !important;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 8px 20px rgba(42, 115, 255, 0.35);
}

.chat-input-area {
    padding: 12px;
    display: flex;
    gap: 10px;
    background: rgba(0, 0, 0, 0.18);
    border-top: 1px solid rgba(255,255,255,0.1);
}

.chat-input-area input {
    flex: 1;
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 14px;
    padding: 10px 14px;
    color: white;
    outline: none;
}

.chat-input-area input::placeholder { color: rgba(255,255,255,0.6); }

.chat-input-area button {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    color: #fff;
    background: linear-gradient(130deg, #335bff, #4cc2ff);
    box-shadow: 0 10px 22px rgba(39, 118, 255, 0.35);
}

.close-btn {
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 8px;
    color: #fff;
    font-size: 20px;
    line-height: 1;
    background: rgba(255,255,255,0.12);
}

/* Cross-page entrance: cat slides in from beyond the viewport (like it followed you) */
#floating-cat-container.elina-cross-prep {
    /* removed pointer-events: none to allow interaction during entrance */
    pointer-events: auto;
}
#floating-cat-container.elina-cross-from-outside {
    transform: translate3d(200px, 90px, 0) scale(0.88);
    opacity: 0;
    transition: none !important;
}
#floating-cat-container.elina-cross-from-outside.elina-from-left {
    transform: translate3d(-200px, 70px, 0) scale(0.88);
}
#floating-cat-container.elina-cross-from-outside.elina-from-bottom {
    transform: translate3d(40px, 160px, 0) scale(0.88);
}
#floating-cat-container.elina-cross-settle {
    transform: translate3d(0, 0, 0) scale(1) !important;
    opacity: 1 !important;
    transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.2s ease !important;
    will-change: transform;
}
</style>
<div id="floating-cat-container">
    <div id="cat-trigger">
        <img
            src="{% static 'images/Lovely Cat.gif' %}"
            data-idle-src="{% static 'images/Lovely Cat.gif' %}"
            data-run-src="{% static 'images/cat_run.gif' %}"
            data-wave-src="{% static 'images/cat_wave.gif' %}"
            data-sit-src="{% static 'images/cat_sit.gif' %}"
            data-edge-hold-src="{% static 'images/cat_hold_edge.gif' %}"
            data-sleep-src="{% static 'images/cat_sleep.gif' %}"
            data-play-src="{% static 'images/cat_play.gif' %}"
            id="main-cat-img"
            alt="Elina"
        >
    </div>
</div>

<script>
const isLoggedIn = "{{ user.is_authenticated|yesno:'true,false' }}";
const chatUserName = "{{ user.username|default:'' }}";
</script>

<div id="premium-chatbox" class="glass-effect">
    <div class="chat-header">
        <div class="user-info">
            <div class="status-dot"></div>
            <div class="ai-meta">
                <span class="ai-name">Elina AI</span>
                <small class="ai-tagline">Premium fitness assistant</small>
            </div>
        </div>
        <button onclick="toggleChat()" class="close-btn">&times;</button>
    </div>
    <div id="chat-messages">
    </div>
    <div class="chat-input-area">
        <input type="text" id="ai-user-input" placeholder="Type a message...">
        <button onclick="sendToAI()"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
(function () {
    // Homepage already loads full chatbot logic from static/js/script.js.
    // Avoid double-binding handlers there.
    if (typeof window.sendToAI === "function" && typeof window.toggleChat === "function") {
        return;
    }

    const cat = document.getElementById("floating-cat-container");
    const catImg = document.getElementById("main-cat-img");
    const chatBox = document.getElementById("premium-chatbox");
    const input = document.getElementById("ai-user-input");
    const messages = document.getElementById("chat-messages");
    const csrfInput = document.querySelector("[name=csrfmiddlewaretoken]");

    if (!cat || !chatBox || !input || !messages) return;

    // --- Easy behavior tuning (milliseconds) ---
    // You can tweak these values without touching core logic.
    const ELINA_CONFIG = {
        inactivitySleepDelayMs: 38000, // no user activity -> sleep starts
        sleepPhaseMs: 6500,            // how long sleep gif stays before play gif
        playPhaseMs: 3000,             // how long play gif stays before idle
        crossPageSettleFallbackMs: 2500 // match direct page load timing for consistency
    };

    function appendMessage(type, text) {
        const align = type === "user" ? "flex-end" : "flex-start";
        const bubbleClass = type === "user" ? "user-msg" : "bot-msg";
        messages.innerHTML += `<div class="message-wrapper ${type}" style="justify-content: ${align}; display: flex; margin-bottom: 10px;"><div class="${bubbleClass}" style="padding: 8px 15px; border-radius: 15px;">${text}</div></div>`;
        messages.scrollTop = messages.scrollHeight;
    }

    let typingEl = null;
    function showTyping() {
        if (!messages) return;
        if (typingEl && typingEl.isConnected) return;
        const wrap = document.createElement("div");
        wrap.className = "message-wrapper bot";
        wrap.style.cssText = "justify-content:flex-start; display:flex; margin-bottom:10px;";
        wrap.innerHTML = `
          <div class="bot-msg typing-bubble" style="padding: 8px 15px; border-radius: 15px;">
            <span style="color: rgba(255,255,255,0.9); font-weight: 700; font-size: 12px;">Elina</span>
            <span class="typing-dots" aria-label="Typing">
              <span></span><span></span><span></span>
            </span>
          </div>
        `;
        typingEl = wrap;
        messages.appendChild(wrap);
        messages.scrollTop = messages.scrollHeight;
    }

    function hideTyping() {
        try { typingEl?.remove(); } catch (e) {}
        typingEl = null;
    }

    function maybeSendGreetingOnOpen() {
        if (!messages) return;
        const alreadyHasMsgs = messages.querySelectorAll(".message-wrapper").length > 0;
        if (alreadyHasMsgs) return;

        const name = (typeof chatUserName !== "undefined" && chatUserName) ? chatUserName : "";
        const logged = (typeof isLoggedIn !== "undefined" && isLoggedIn === "true");
        const who = (logged && name) ? name : "human";

        const greetings = [
            `Yeah, yeah… welcome${logged ? " back" : ""}, ${who}. What do you want—fat loss, muscle, or stamina?`,
            `You're here again, ${who}. Ask your fitness question before I change my mind.`,
            `Alright ${who}. Give me your goal and your current weight. No excuses.`,
            `Hmm. ${who}, tell me what you trained today—or admit you didn't.`
        ];
        const pick = greetings[Math.floor(Math.random() * greetings.length)];
        appendMessage("bot", pick);
    }

    window.toggleChat = window.toggleChat || function () {
        chatBox.style.display = chatBox.style.display === "flex" ? "none" : "flex";
        if (chatBox.style.display === "flex") {
            maybeSendGreetingOnOpen();
        }
    };

    function setCatImg(src) {
        if (!catImg || !src) return;
        const isGif = /\.gif(\?|$)/i.test(src);
        const next = (isGif ? (src + (src.includes("?") ? "&" : "?") + "v=" + Date.now()) : src);
        catImg.src = next;
    }

    // Preload GIFs to make switching reliable
    if (catImg && catImg.dataset && catImg.dataset.runSrc) {
        const preload = new Image();
        preload.src = catImg.dataset.runSrc;
    }
    if (catImg && catImg.dataset && catImg.dataset.edgeHoldSrc) {
        const preloadEdge = new Image();
        preloadEdge.src = catImg.dataset.edgeHoldSrc;
    }
    if (catImg && catImg.dataset && catImg.dataset.sleepSrc) {
        const preloadSleep = new Image();
        preloadSleep.src = catImg.dataset.sleepSrc;
    }
    if (catImg && catImg.dataset && catImg.dataset.playSrc) {
        const preloadPlay = new Image();
        preloadPlay.src = catImg.dataset.playSrc;
    }
    let canUseSitGif = false;
    if (catImg && catImg.dataset && catImg.dataset.sitSrc) {
        const preloadSit = new Image();
        preloadSit.onload = function () { canUseSitGif = true; };
        preloadSit.onerror = function () { canUseSitGif = false; };
        preloadSit.src = catImg.dataset.sitSrc;
    }

    function runCatToElinaTextFallback() {
        const aiText = chatBox.querySelector('.ai-name') || chatBox.querySelector('.chat-header .user-info span');
        if (!aiText) return;
        // Any time the cat moves, show run GIF.
        if (catImg && catImg.dataset && catImg.dataset.runSrc) setCatImg(catImg.dataset.runSrc);

        requestAnimationFrame(function () {
            const catRect = cat.getBoundingClientRect();
            const textRect = aiText.getBoundingClientRect();
            let newLeft = textRect.left + (textRect.width / 2) - (catRect.width / 2);
            let newTop = textRect.top - (catRect.height * 0.85);
            const maxLeft = window.innerWidth - catRect.width - 10;
            const maxTop = window.innerHeight - catRect.height - 10;
            newLeft = Math.max(10, Math.min(newLeft, maxLeft));
            newTop = Math.max(10, Math.min(newTop, maxTop));
            cat.style.transition = "all 0.9s ease-in-out";
            cat.style.left = newLeft + "px";
            cat.style.top = newTop + "px";
            cat.style.right = "auto";
            cat.style.bottom = "auto";
        });

        setTimeout(function () {
            // Stop = sit immediately (fallback to idle if sit isn't available).
            if (catImg && catImg.dataset.sitSrc && canUseSitGif) setCatImg(catImg.dataset.sitSrc);
            else if (catImg && catImg.dataset.idleSrc) setCatImg(catImg.dataset.idleSrc);
        }, 900);
    }

    function triggerCatRunToHeader() {
        const aiText = chatBox.querySelector('.ai-name') || chatBox.querySelector('.chat-header .user-info span');
        if (!aiText) return;
        if (catImg && catImg.dataset.runSrc) setCatImg(catImg.dataset.runSrc);
        runCatToElinaTextFallback();
        setTimeout(function () {
            // Switch immediately to sitting after run ends.
            if (catImg && catImg.dataset.sitSrc && canUseSitGif) setCatImg(catImg.dataset.sitSrc);
            else if (catImg && catImg.dataset.idleSrc) setCatImg(catImg.dataset.idleSrc);
        }, 900);
    }

    function triggerCatRunAwayFast() {
        const maxX = window.innerWidth - 180;
        const maxY = window.innerHeight - 180;
        // Prevent "teleport" on first run by anchoring current fixed position
        // before switching from right/bottom to left/top.
        const rect = cat.getBoundingClientRect();
        cat.style.transition = "none";
        cat.style.left = rect.left + "px";
        cat.style.top = rect.top + "px";
        cat.style.right = "auto";
        cat.style.bottom = "auto";

        if (catImg && catImg.dataset.runSrc) setCatImg(catImg.dataset.runSrc);

        requestAnimationFrame(function () {
            cat.style.transition = "all 1.05s ease-in-out";
            cat.style.left = (Math.random() * maxX) + "px";
            cat.style.top = (Math.random() * maxY) + "px";
        });

        const switchToSit = function () {
            cat.removeEventListener("transitionend", switchToSit);
            if (catImg && catImg.dataset.sitSrc && canUseSitGif) setCatImg(catImg.dataset.sitSrc);
            else if (catImg && catImg.dataset.idleSrc) setCatImg(catImg.dataset.idleSrc);
        };
        cat.addEventListener("transitionend", switchToSit);
        setTimeout(switchToSit, 1200);
    }

    // --- Inactivity behavior: sleep, then play, then idle ---
    const IDLE_SLEEP_MS = ELINA_CONFIG.inactivitySleepDelayMs;
    let inactivityTimer = null;
    let playTimer = null;
    let sleepTimer = null;
    let isIdleAnimating = false;

    function clearIdleTimers() {
        if (inactivityTimer) clearTimeout(inactivityTimer);
        if (playTimer) clearTimeout(playTimer);
        if (sleepTimer) clearTimeout(sleepTimer);
        inactivityTimer = null;
        playTimer = null;
        sleepTimer = null;
    }

    function resetToIdleGif() {
        if (!catImg) return;
        setCatImg(catImg.dataset.idleSrc || catImg.dataset.waveSrc);
        isIdleAnimating = false;
    }

    function runIdleCycle() {
        if (!catImg || isDragging || isMoving) return;
        if (chatBox.style.display === "flex") return; // don't run sleep/play while actively chatting
        isIdleAnimating = true;
        
        // Randomly choose between sleep and play
        const useSleep = Math.random() < 0.5;
        
        if (useSleep && catImg.dataset.sleepSrc) {
            setCatImg(catImg.dataset.sleepSrc);
            playTimer = setTimeout(function () {
                if (!catImg) return;
                setCatImg(catImg.dataset.playSrc || catImg.dataset.idleSrc);
                sleepTimer = setTimeout(function () {
                    resetToIdleGif();
                    scheduleIdleCycle();
                }, ELINA_CONFIG.playPhaseMs);
            }, ELINA_CONFIG.sleepPhaseMs);
        } else {
            // Start with play if sleep not available or randomly chosen
            setCatImg(catImg.dataset.playSrc || catImg.dataset.waveSrc || catImg.dataset.idleSrc);
            sleepTimer = setTimeout(function () {
                resetToIdleGif();
                scheduleIdleCycle();
            }, ELINA_CONFIG.playPhaseMs);
        }
    }

    function scheduleIdleCycle() {
        clearIdleTimers();
        inactivityTimer = setTimeout(runIdleCycle, IDLE_SLEEP_MS);
    }

    function markActivity() {
        // If they interact while still in the "following" animation, cleanup immediately.
        if (typeof window.elinaCleanupEntrance === "function") window.elinaCleanupEntrance();

        clearIdleTimers();
        if (isIdleAnimating) resetToIdleGif();
        scheduleIdleCycle();
    }

    let isDragging = false;
    let isMoving = false;
    let startX = 0, startY = 0;
    let offsetX = 0, offsetY = 0;
    let pressTimer = null;
    const LONG_PRESS_MS = 320;
    let activePointerId = null;

    function clearPressTimer() {
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
    }

    function handleClickToggle() {
        if (typeof isLoggedIn !== "undefined" && isLoggedIn === "false") {
            triggerCatRunAwayFast();
            return;
        }
        const willOpen = chatBox.style.display !== "flex";
        window.toggleChat();
        if (willOpen) {
            // On open: cat moves to header -> must use run GIF.
            setTimeout(runCatToElinaTextFallback, 40);
            // Ensure greeting appears even if chat is opened without toggleChat (long-press fallback)
            setTimeout(maybeSendGreetingOnOpen, 60);
        }
    }

    // --- Pointer Events drag (preferred) ---
    function onPointerMove(e) {
        if (activePointerId === null || e.pointerId !== activePointerId) return;
        const moveX = Math.abs(e.clientX - startX);
        const moveY = Math.abs(e.clientY - startY);
        if (moveX > 5 || moveY > 5) {
            isDragging = true;
            isMoving = true;
            clearPressTimer();
            e.preventDefault();
            if (catImg && catImg.dataset && catImg.dataset.runSrc) setCatImg(catImg.dataset.runSrc);
            cat.style.transition = "none";
            cat.style.left = (e.clientX - offsetX) + "px";
            cat.style.top = (e.clientY - offsetY) + "px";
            cat.style.right = "auto";
            cat.style.bottom = "auto";
        }
    }

    function endPointerInteraction() {
        clearPressTimer();
        activePointerId = null;
        cat.style.transition = "all 0.3s ease";
        isDragging = false;
        isMoving = false;
        // End of movement -> sit immediately (fallback to idle).
        if (catImg && catImg.dataset && catImg.dataset.sitSrc && canUseSitGif) setCatImg(catImg.dataset.sitSrc);
        else if (catImg && catImg.dataset && catImg.dataset.idleSrc) setCatImg(catImg.dataset.idleSrc);
    }

    if (window.PointerEvent) {
        cat.addEventListener("pointerdown", function (e) {
            if (e.button !== undefined && e.button !== 0) return;
            activePointerId = e.pointerId;
            isDragging = false;
            isMoving = false;
            startX = e.clientX;
            startY = e.clientY;
            const rect = cat.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;

            try { cat.setPointerCapture(e.pointerId); } catch (err) {}
            e.preventDefault();

            // Long-press opens chat reliably.
            pressTimer = setTimeout(function () {
                if (!isMoving && !isDragging) {
                    chatBox.style.display = "flex";
                    maybeSendGreetingOnOpen();
                }
            }, LONG_PRESS_MS);
        });

        cat.addEventListener("pointermove", onPointerMove);

        cat.addEventListener("pointerup", function (e) {
            if (activePointerId === null || e.pointerId !== activePointerId) return;
            try { cat.releasePointerCapture(e.pointerId); } catch (err) {}
            const wasDrag = isDragging;
            endPointerInteraction();
            if (!wasDrag) handleClickToggle();
        });

        cat.addEventListener("pointercancel", function (e) {
            if (activePointerId === null || e.pointerId !== activePointerId) return;
            try { cat.releasePointerCapture(e.pointerId); } catch (err) {}
            endPointerInteraction();
        });
    } else {
        // --- Mouse fallback drag ---
        function onMouseMove(e) {
            const moveX = Math.abs(e.clientX - startX);
            const moveY = Math.abs(e.clientY - startY);
            if (moveX > 5 || moveY > 5) {
                isDragging = true;
                isMoving = true;
                clearPressTimer();
                cat.style.transition = "none";
                cat.style.left = (e.clientX - offsetX) + "px";
                cat.style.top = (e.clientY - offsetY) + "px";
                cat.style.right = "auto";
                cat.style.bottom = "auto";
            }
        }

        function onMouseUp() {
            window.removeEventListener("mousemove", onMouseMove);
            window.removeEventListener("mouseup", onMouseUp);
            clearPressTimer();
            const wasDrag = isDragging;
            cat.style.transition = "all 0.3s ease";
            isDragging = false;
            isMoving = false;
            if (!wasDrag) handleClickToggle();
        }

        cat.addEventListener("mousedown", function (e) {
            if (e.button !== 0) return;
            isDragging = false;
            isMoving = false;
            startX = e.clientX;
            startY = e.clientY;
            const rect = cat.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            window.addEventListener("mousemove", onMouseMove);
            window.addEventListener("mouseup", onMouseUp);
            pressTimer = setTimeout(function () {
                if (!isMoving && !isDragging) chatBox.style.display = "flex";
            }, LONG_PRESS_MS);
        });
    }

    // Hard safety: if mouse button released outside window, cancel drag.
    window.addEventListener("blur", function () {
        isDragging = false;
        isMoving = false;
        activePointerId = null;
        clearPressTimer();
        cat.style.transition = "all 0.3s ease";
    });

    // Prevent duplicated click handlers (pointerup/mouseup handles click behavior).

    // On page load: different behavior for homepage vs other pages
    document.addEventListener("DOMContentLoaded", function () {
        if (!catImg) return;
        
        const isHomepage = window.location.pathname === '/' || window.location.pathname === '/home/';
        
        // Always show entrance animation, but handle cross-page differently
        if (sessionStorage.getItem("elina_nav_internal") === "1") {
            // Cross-page navigation: let crossPageTravel handle it
            return;
        }

        // Direct page load (not internal navigation)
        if (isHomepage) {
            // Homepage: wave once, then return to idle
            if (catImg.dataset.waveSrc) {
                setCatImg(catImg.dataset.waveSrc);
                setTimeout(function () {
                    setCatImg(catImg.dataset.idleSrc);
                }, 2000); // 2 seconds for wave animation
            }
        } else {
            // Other pages: hold edge, then return to idle
            if (catImg.dataset.edgeHoldSrc) {
                setCatImg(catImg.dataset.edgeHoldSrc);
                setTimeout(function () {
                    setCatImg(catImg.dataset.idleSrc);
                }, 2500); // 2.5 seconds for hold edge animation
            }
        }
        scheduleIdleCycle();
    });

    window.sendToAI = window.sendToAI || async function () {
        const text = input.value.trim();
        if (!text) return;
        markActivity();
        appendMessage("user", text);
        input.value = "";
        showTyping();

        // Logged-in: any message triggers the run animation (as requested).
        // Logged-out: keep current behavior (cat runs away only on click).
        if (typeof isLoggedIn !== "undefined" && isLoggedIn === "true") {
            // If they want to "catch" the cat, run away. Otherwise run to header.
            if (/catch/i.test(text)) triggerCatRunAwayFast();
            else triggerCatRunToHeader();
        }

        try {
            const response = await fetch("/chat-with-ai/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-CSRFToken": csrfInput ? csrfInput.value : ""
                },
                body: `text=${encodeURIComponent(text)}`
            });
            const data = await response.json();
            hideTyping();
            appendMessage("bot", data.reply || "Hmph. Ask again, human.");
        } catch (e) {
            hideTyping();
            appendMessage("bot", "Network issue. Try again.");
        }
    };

    input.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
            e.preventDefault();
            window.sendToAI();
        }
    });

    ["mousemove", "keydown", "scroll", "touchstart", "pointerdown"].forEach(function (evt) {
        window.addEventListener(evt, markActivity, { passive: true });
    });
    cat.addEventListener("click", markActivity);
})();

/**
 * Elina cross-page travel: next page load, she enters from outside the viewport
 * (sessionStorage set when user follows an internal link).
 */
(function elinaCrossPageTravel() {
    var STORAGE = "elina_nav_internal";
    var EDGE = "elina_nav_edge";

    document.addEventListener("click", function (e) {
        var a = e.target.closest && e.target.closest("a[href]");
        if (!a) return;
        var href = a.getAttribute("href");
        if (!href || href === "#" || href.indexOf("javascript:") === 0) return;
        if (a.getAttribute("download") != null) return;
        if (a.target === "_blank" || a.target === "_parent") return;
        try {
            var next = new URL(a.href, window.location.href);
            if (next.origin !== window.location.origin) return;
            sessionStorage.setItem(STORAGE, "1");
            var edges = ["", "elina-from-left", "elina-from-bottom"];
            sessionStorage.setItem(EDGE, edges[Math.floor(Math.random() * edges.length)]);
        } catch (err) {}
    }, true);

    function run() {
        var cat = document.getElementById("floating-cat-container");
        var catImg = document.getElementById("main-cat-img");
        if (!cat) return;
        if (sessionStorage.getItem(STORAGE) !== "1") return;
        sessionStorage.removeItem(STORAGE);
        var edge = sessionStorage.getItem(EDGE) || "";
        sessionStorage.removeItem(EDGE);

        // For cross-page navigation, always use edge hold animation
        if (catImg && catImg.dataset && catImg.dataset.edgeHoldSrc) {
            var edgeSrc = catImg.dataset.edgeHoldSrc;
            catImg.src = edgeSrc + (edgeSrc.indexOf("?") > -1 ? "&" : "?") + "v=" + Date.now();
        }

        cat.classList.add("elina-cross-prep", "elina-cross-from-outside");
        if (edge) cat.classList.add(edge);

        var cleaned = false;
        window.elinaCleanupEntrance = function () {
            if (cleaned) return;
            cleaned = true;
            cat.classList.remove(
                "elina-cross-prep",
                "elina-cross-from-outside",
                "elina-cross-settle",
                "elina-from-left",
                "elina-from-bottom"
            );
            cat.style.willChange = "";
            cat.style.transition = ""; // let normal dragging transition take over

            // After cross-page entrance, always return to idle after animation
            setTimeout(function() {
                if (catImg && catImg.dataset && catImg.dataset.idleSrc) {
                    catImg.src = catImg.dataset.idleSrc;
                }
                // Start idle cycle after returning to idle
                scheduleIdleCycle();
            }, 500); // Small delay to ensure smooth transition
        };

        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                cat.style.willChange = "transform, opacity";
                cat.classList.add("elina-cross-settle");
                // Remove transitionend listener and just use fallback timeout
                // to ensure it stays as edgeHoldSrc for exactly crossPageSettleFallbackMs.
                setTimeout(window.elinaCleanupEntrance, ELINA_CONFIG.crossPageSettleFallbackMs);
            });
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", run);
    } else {
        run();
    }
})();
</script>
