{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Submitted</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .success-box {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            max-width: 450px;
            width: 100%;
        }
        .success-icon {
            font-size: 70px;
            color: #00ff9d;
            margin-bottom: 20px;
        }
        .btn-home {
            background: #00ff9d;
            color: #000;
            font-weight: bold;
            border-radius: 30px;
            padding: 10px 25px;
            text-decoration: none;
            transition: 0.3s;
        }
        .btn-home:hover {
            background: #00cc7a;
            color: #000;
        }
    </style>
</head>
<body>
{% include "navbar.html" %}

<div class="success-box">
    <div class="success-icon">⏳</div>
    <h2>Payment Submitted</h2>
    <p class="mt-3">
        Thank you for submitting your payment request.<br>
        Our admin team will verify the transaction and let you know after confirmation.
    </p>

    <a href="{% url 'home' %}" class="btn-home mt-4 d-inline-block">
        Go to Home
    </a>
</div>
{% include "chatbox_partial.html" %}
</body>
</html>
